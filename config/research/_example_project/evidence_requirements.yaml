# Evidence Requirements — Example Project

minimum_for_scoring:
  - At least one Tier 1 or Tier 2 source for core_service_match claim
  - Access date recorded for each external URL
  - Classification recorded for each material claim

minimum_for_shortlist:
  - All required gates evaluated (not blank)
  - Confidence assigned
  - QC modules enabled in modules.yaml completed or explicitly skipped with reason

core_claims:
  - id: service_offering
    label_ja: 提供サービス内容
    minimum_tier: TIER_2_PROFESSIONAL
  - id: geographic_availability
    label_ja: 提供地域
    minimum_tier: TIER_1_OFFICIAL
  - id: pricing_model
    label_ja: 料金モデル
    minimum_tier: TIER_1_OFFICIAL

prohibited_as_sole_evidence:
  - Search result snippets without page verification
  - Referral without any official source
  - Review count or star rating alone

evidence_file_convention: |
  Path: research/<project-id>/evidence/<phase>/<candidate_id>-<topic>.md
  Use templates/evidence_record.md
