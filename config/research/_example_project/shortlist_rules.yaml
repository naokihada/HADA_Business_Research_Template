# Shortlist Rules — Example Project

candidate_universe:
  source: data/master/candidates_master.csv
  allow_expansion_during_shortlist: false

eligibility_for_shortlist:
  required_conditions:
    - research_status not in [INACTIVE, DUPLICATE, EXCLUDED, UNVERIFIED]
    - no hard gate failure (gate status NO on required gates)
    - recommendation not D unless explicitly flagged as backup review

disqualifiers:
  - condition: gate currently_operating = NO
    action: EXCLUDED
  - condition: gate core_service_match = NO
    action: EXCLUDED
  - condition: research_status = DUPLICATE
    action: EXCLUDED
    note: Contact canonical candidate only
  - condition: research_status = INACTIVE
    action: EXCLUDED

tiers:
  TIER_1:
    label_ja: 第一候補（最初に接触）
    requirements:
      min_recommendation: B
      min_confidence: MEDIUM
      min_score: 70
      min_gates_yes: 3
      required_gate_ids:
        - currently_operating
        - core_service_match
        - geographic_coverage
    tie_breakers:
      - more gates confirmed YES
      - higher confidence
      - higher core_capability score

  TIER_2:
    label_ja: 有力代替
    requirements:
      min_recommendation: B
      min_confidence: LOW
      min_score: 55
      min_gates_yes: 2

  TIER_3:
    label_ja: 予備
    requirements:
      min_recommendation: C
      min_score: 40

  EXCLUDED:
    label_ja: 除外
    description: Hard disqualifier or recommendation D

shortlist_is_not_score_only: |
  Tier placement requires gates, score, confidence, and QC status.
  Highest score alone does not guarantee TIER_1.

contact_priority: |
  Contact priority may differ from tier rank.
  Document rationale when priority order differs from score order.

follow_up_before_selection:
  - Confirm pricing for expected data volume
  - Confirm SSO and API requirements if UNKNOWN
  - Confirm support SLA for production use
