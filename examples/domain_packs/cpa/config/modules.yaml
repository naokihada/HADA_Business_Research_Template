# QC Modules — CPA Domain Pack

modules:
  - id: source_quality_review
    label_ja: ソース品質レビュー
    enabled: true
    scope: all
    evidence_dir: evidence/qc_source_quality
    summary_csv: scoring/qc_source_quality_summary.csv

  - id: consistency_review
    label_ja: 整合性レビュー
    enabled: true
    scope: top_n
    top_n: 2
    evidence_dir: evidence/qc_consistency
    summary_csv: scoring/qc_consistency_summary.csv

  - id: regulatory_verification
    label_ja: ライセンス / 規制確認
    enabled: true
    scope: shortlist_candidates_only
    evidence_dir: evidence/qc_regulatory
    summary_csv: scoring/qc_regulatory_summary.csv
    notes: Simulated license checks in fictional example — not real DCA lookup

  - id: reputation_review
    label_ja: 評判レビュー
    enabled: false

execution_order:
  - source_quality_review
  - consistency_review
  - regulatory_verification
